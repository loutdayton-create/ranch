<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Cottonwood Ranch</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:  #f7f2ea;
      --tan:    #d9c9a8;
      --sand:   #c4a97d;
      --terra:  #c47a50;
      --denim:  #7a8fa6;
      --brown:  #6b4f35;
      --dark:   #3a2a1a;
      --text:   #4a3728;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-weight: 400;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 4rem;
      background: rgba(247, 242, 234, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--tan);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.6rem;
    }

    .brand-img {
      display: block;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(160deg, var(--tan), var(--sand));
      flex-shrink: 0;
      text-decoration: none;
    }

    .brand-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .header-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      font-weight: 600;
      color: var(--brown);
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 3.5rem;
      align-items: center;
    }

    nav a {
      font-family: 'Jost', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--terra); }
    nav a.active { color: var(--terra); }

    .nav-cta {
      background: var(--terra);
      color: #fff !important;
      padding: 0.7rem 1.8rem;
      border-radius: 2px;
      letter-spacing: 0.12em;
      transition: background 0.2s !important;
    }

    .nav-cta:hover { background: var(--brown) !important; }

    /* ── HERO ── */
    .page-hero {
      position: relative;
      height: 65vh;
      min-height: 460px;
      display: flex;
      align-items: flex-end;
      padding: 0 4rem 4rem;
      margin-top: 0;
    }

    .page-hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('images/blmsunset.jpeg');
      background-size: cover;
      background-position: center 20%;
      z-index: 0;
    }

    .page-hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(30,18,8,0.72) 0%, rgba(30,18,8,0.1) 100%);
    }

    .page-hero-content {
      position: relative;
      z-index: 1;
      padding-top: 90px;
    }

    .eyebrow {
      font-size: 0.82rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--sand);
      font-weight: 600;
      margin-bottom: 0.8rem;
    }

    .page-hero-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 4vw, 3.8rem);
      font-weight: 600;
      color: var(--cream);
      line-height: 1.15;
    }

    /* ── CONTACT SECTION ── */
    .contact {
      max-width: 1000px;
      margin: 0 auto;
      padding: 6rem 4rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: start;
    }

    .contact-col h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 0.6rem;
    }

    .contact-col .rule {
      width: 40px;
      height: 3px;
      background: var(--terra);
      margin-bottom: 2rem;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 1.8rem;
    }

    .contact-item strong {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sand);
      font-weight: 600;
    }
