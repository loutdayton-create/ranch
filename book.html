<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Stay — Cottonwood Ranch</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:  #f7f2ea;
      --tan:    #d9c9a8;
      --sand:   #c4a97d;
      --terra:  #c47a50;
      --denim:  #7a8fa6;
      --brown:  #6b4f35;
      --dark:   #3a2a1a;
      --text:   #4a3728;
    }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: 'Jost', sans-serif;
      font-weight: 400;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 4rem;
      background: rgba(247, 242, 234, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--tan);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.6rem;
    }

    .brand-img {
      display: block;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(160deg, var(--tan), var(--sand));
      flex-shrink: 0;
      text-decoration: none;
    }

    .brand-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .header-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      font-weight: 600;
      color: var(--brown);
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 3.5rem;
      align-items: center;
    }

    nav a {
      font-family: 'Jost', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--terra); }

    .nav-cta {
      background: var(--terra);
      color: #fff !important;
      padding: 0.7rem 1.8rem;
      border-radius: 2px;
      letter-spacing: 0.12em;
      transition: background 0.2s !important;
    }

    .nav-cta:hover { background: var(--brown) !important; }

    /* ── FULL PAGE HERO ── */
    .booking-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 96px;
      background-color: #1a0f06;
      background-image: url('images/horsehat.jpg');
      background-size: 55%;
      background-position: center;
      background-repeat: no-repeat;
    }

    .booking-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(30, 18, 8, 0.58);
    }

    .booking-hero-text {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 4rem;
    }

    .booking-hero-content {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 5rem;
      max-width: 1100px;
      width: 100%;
    }

    .booking-left {
      flex: 1;
    }

    .booking-left h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 4vw, 3.6rem);
      font-weight: 600;
      color: var(--cream);
      line-height: 1.15;
      margin-bottom: 0.8rem;
    }

    .booking-tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--terra);
      margin-bottom: 1rem;
    }

    .booking-left p {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--tan);
      line-height: 1.75;
    }

    .airbnb-rating {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .stars {
      color: var(--terra);
      font-size: 1.2rem;
      letter-spacing: 0.05em;
    }

    .rating-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--tan);
      letter-spacing: 0.03em;
    }

    .booking-divider {
      width: 2px;
      height: 160px;
      background: linear-gradient(to bottom, transparent, var(--sand), transparent);
      flex-shrink: 0;
    }

    .booking-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex-shrink: 0;
    }

    .btn-book {
      display: inline-block;
      padding: 1rem 2.8rem;
      font-family: 'Jost', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      background: var(--terra);
      color: #fff;
      border: 2px solid var(--terra);
      transition: all 0.22s ease;
      text-align: center;
    }

    .btn-book:hover {
      background: transparent;
      color: var(--cream);
      border-color: var(--cream);
    }

    .coming-soon-note {
      display: block;
      padding: 0.8rem 1.4rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sand);
      border: 2px solid rgba(196,169,125,0.35);
      border-radius: 2px;
      text-align: center;
      line-height: 1.5;
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      background: var(--dark);
      color: var(--sand);
      text-align: center;
      padding: 2rem;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.1em;
    }

    footer a { color: var(--sand); text-decoration: none; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .booking-hero-content > * {
      animation: fadeUp 0.7s ease both;
    }
    .booking-hero-content > *:nth-child(1) { animation-delay: 0.1s; }
    .booking-hero-content > *:nth-child(2) { animation-delay: 0.24s; }
    .booking-hero-content > *:nth-child(3) { animation-delay: 0.38s; }
    .booking-hero-content > *:nth-child(4) { animation-delay: 0.52s; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      header { padding: 1rem 1.5rem; }
      nav { gap: 1.2rem; }
      .booking-hero-content { flex-direction: column; gap: 2rem; }
      .booking-divider { width: 80px; height: 2px; }
      .booking-hero-text { padding: 2rem; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <a href="index.html" class="brand-img">
        <img src="images/logo.png" alt="Cottonwood Ranch" />
      </a>
      <a href="index.html" class="header-logo">Cottonwood Ranch</a>
    </div>
    <nav>
      <a href="about.html">Our Ranch</a>
      <a href="contact.html">Contact Us</a>
      <a href="booking.html" class="nav-cta">Book a Stay</a>

          <span class="coming-soon-note">Direct booking on this page — coming soon</span>
        </div>
      </div>
    </div>
  </section>
